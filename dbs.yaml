# M7 票 02：web demo 预置库注册表（A 轨）——名→路径→默认 evidence/口径。
#
# 口径单一来源红线：本仓库已有指标注册表 metrics/<db>.yaml 的库（如 financial）
# 禁在本文件写 evidence——加载期直接拒绝（双写＝第二真源漂移）。其默认口径由
# qadata.web.dbs.metric_evidence_text 从指标注册表确定性派生（零 LLM），
# 派生文本自带「演示摘录，非第二真源」标注并指回真源文件。
# 无指标注册表的库如确需默认口径，才可在此写 evidence 文本。
#
# 护栏保护半径（评审记录，如实声明）：按库名寻址（与指标层 metrics/<db>.yaml
# 同寻址）——给同一 sqlite 文件改键名再抄一份口径可绕过加载期拒绝，属人审
# 职责（本文件是策展人审文件）；机器侧权限校验层 owner 裁暂缓、另案。
#
# 路径相对本文件所在目录解析（演示库 data/ 不入库，本地存在才有；缺文件如实空列表）。
