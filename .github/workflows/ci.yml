name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装
        run: python -m pip install -e ".[dev]"
      - name: 静态检查
        run: ruff check src tests
      - name: 单元与组件测试
        run: python -m pytest -q
