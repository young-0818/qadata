[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qadata"
version = "0.1.0"
description = "对话式数据分析 Agent（LangGraph + BIRD 评测）"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "sqlglot>=30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.5"]

[project.scripts]
qadata = "qadata.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qadata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
