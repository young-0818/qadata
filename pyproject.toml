[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qadata"
version = "0.1.0"
description = "对话式数据分析 Agent（LangGraph + BIRD 评测）"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "sqlglot>=30",
    "pyyaml>=6.0",
    "fastapi>=0.110",   # M7 票 01：web 薄壳 API＋静态同源服务
    "uvicorn>=0.29",    # M7 票 01：qadata serve 单进程启动器
    "opentelemetry-sdk>=1.27",                       # M9 票 01：帧流→span 镜像（测试用内存 exporter，零联网）
    "opentelemetry-exporter-otlp-proto-http>=1.27",  # M9 票 01：OTLP→Langfuse 出口（懒 import，默认关进程不碰）
    "tiktoken>=0.9",  # M9 票 04：Compress 保险丝前置计量（词表＝仓内资产本地加载，不碰网络）
    "numpy>=1.26",  # M10：检索层点积/全索引扫描（值索引×表卡；owner 裁 2026-09-20 开工前预装，纯 Python 实测 80ms/2k 条见探针档）
    "openai>=1.40",  # M9 票 06：/v1/embeddings 向量化通道（显式登记不赖 langchain-openai 传递——tiktoken 先例）
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.5", "httpx>=0.27"]  # httpx＝TestClient 所需（M7 契约测试）

[project.scripts]
qadata = "qadata.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qadata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
